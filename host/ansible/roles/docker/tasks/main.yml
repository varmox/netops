---
# Docker Engine from Docker's repository, daemon hardened (CIS Docker Benchmark 2.x, NIST SP 800-190).

- name: Docker's apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: The key must be Docker's release key (fingerprint pinned)
  ansible.builtin.shell: >
    set -o pipefail &&
    gpg --show-keys --with-colons /etc/apt/keyrings/docker.asc | awk -F: '/^fpr/ {print $10; exit}'
  args:
    executable: /bin/bash
  register: docker_fpr
  changed_when: false
  failed_when: docker_fpr.stdout != "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"

- name: Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Docker Engine and the compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin, docker-buildx-plugin]
    state: present
    update_cache: true

- name: Hardened daemon settings
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "icc": false,
        "no-new-privileges": true,
        "live-restore": true,
        "userland-proxy": false,
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "default-ulimits": { "nofile": { "Name": "nofile", "Soft": 65536, "Hard": 65536 } }
      }
  notify: Restart docker

- name: Only root may use the Docker socket (the docker group is root-equivalent; it stays empty)
  ansible.builtin.command: getent group docker
  register: docker_group
  changed_when: false
  failed_when: docker_group.stdout.split(':')[3] | default('') | length > 0

- name: Keep AIDE out of ephemeral container storage (otherwise the daily integrity check is huge)
  ansible.builtin.copy:
    dest: /etc/aide/aide.conf.d/70-netops-docker
    mode: "0640"
    content: |
      !/var/lib/docker
      !/var/lib/containerd
  failed_when: false

- name: Docker running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  tags: [services]
