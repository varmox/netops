---
# OpenSSH: keys only, no root, FIPS-approved algorithms (DISA STIG), CIS 5.1.

- name: Privilege separation directory (missing until the first connection with socket-activated ssh)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

- name: Hardened sshd settings
  ansible.builtin.template:
    src: 10-netops.conf.j2
    dest: /etc/ssh/sshd_config.d/10-netops.conf
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: "List sshd snippets (first match wins; ours, 10-netops.conf, comes before cloud-init's)"
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
  register: ssh_snippets

- name: Fail if another snippet re-enables password logins
  ansible.builtin.command: grep -lE "^\\s*PasswordAuthentication\\s+yes" {{ item.path }}
  loop: "{{ ssh_snippets.files }}"
  register: ssh_pw_snippets
  changed_when: false
  failed_when: ssh_pw_snippets.rc == 0 and item.path | basename < '10-netops.conf'

- name: Permissions on the host keys
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
  loop: "{{ query('fileglob', '/etc/ssh/ssh_host_*_key') }}"
