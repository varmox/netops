---
- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  tags: [services]

- name: Restart auditd
  # auditd refuses `systemctl restart` (RefuseManualStop); its init script is the supported way.
  ansible.builtin.command: service auditd restart  # noqa: command-instead-of-module
  changed_when: true
  tags: [services]
