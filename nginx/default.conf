# HTTPS on 443 with an app login (session cookie checked by the backend through auth_request).
# The Angular app itself is public, so the login page can load; everything with data behind it is not:
# the API, Grafana and the live alert stream.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# At most 10 sign-in attempts per minute per client address (password, TOTP, recovery, passkey, setup).
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
server_tokens off;

# Upstreams are resolved at request time (Docker's DNS), so nginx also starts without optional services
# such as Grafana; those locations then answer 502 instead of taking the whole UI down.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/netops.crt;
    ssl_certificate_key /etc/nginx/certs/netops.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_tickets off;
    client_max_body_size 2m;

    # Strict browser policy for the app (Grafana under /grafana sets its own, see there).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;

    root /usr/share/nginx/html;
    index index.html;

    # Session check used by everything below that holds data.
    location = /_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Login, logout, "who am I": reachable without a session.
    location /api/auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # with port: WebAuthn origin check
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/auth/(login|setup|totp/verify|recovery/verify|passkey/login/verify)$ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # with port: WebAuthn origin check
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # One-click actions from ntfy alerts: the signed, expiring token in the URL is the authorization.
    location /api/security/act/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # with port: WebAuthn origin check
        proxy_read_timeout 300s;
    }

    # Public, no session: the kiosk/family share link, guarded by its own token in the backend. Nothing
    # else lives under /api/public/. (More specific than /api/, so nginx matches this first.)
    location /api/public/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        auth_request /_auth;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # with port: WebAuthn origin check
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;        # backups can take a while
    }

    location /grafana/ {
        set $grafana http://grafana:3000;
        auth_request /_auth;
        add_header Strict-Transport-Security "max-age=31536000" always;   # (replaces the app CSP: Grafana needs inline scripts)
        error_page 401 = @login;
        proxy_pass $grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # with port: WebAuthn origin check
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Live alerts for the UI: /ntfy/<topic>/sse -> ntfy /<topic>/sse
    location /ntfy/ {
        set $ntfy http://ntfy:80;
        auth_request /_auth;
        rewrite ^/ntfy/(.*)$ /$1 break;
        proxy_pass $ntfy;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Grafana opened directly without a session: send the browser to the login page.
    location @login {
        return 302 /login?next=$request_uri;
    }
}
